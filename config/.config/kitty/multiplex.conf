#------------------------------
# layouts
# ------------------------------
enabled_layouts splits,stack

# ------------------------------
# keybinds
# ------------------------------
# reload config
map ctrl+s>r combine : load_config_file : launch --type=overlay sh -c "echo 'Config reloaded!'; sleep 0.5"

# splitting
map ctrl+s>v launch --location=vsplit --cwd=current
map ctrl+s>o launch --location=hsplit --cwd=current

# zoom/fullscreen pane
map ctrl+s>f toggle_layout stack

# window navigation
map ctrl+s>c new_tab_with_cwd
map ctrl+s>n next_tab
map ctrl+s>p previous_tab
map ctrl+s>1 goto_tab 1
map ctrl+s>2 goto_tab 2
map ctrl+s>3 goto_tab 3
map ctrl+s>4 goto_tab 4

# focus a neighboring pane (or navigate within Vim)
map ctrl+j kitten pass_keys.py bottom ctrl+j
map ctrl+k kitten pass_keys.py top    ctrl+k
map ctrl+h kitten pass_keys.py left   ctrl+h
map ctrl+l kitten pass_keys.py right  ctrl+l

# focus a neighboring pane and toggle zoom
map ctrl+s>j kitten zoom_neighbor.py bottom
map ctrl+s>k kitten zoom_neighbor.py top
map ctrl+s>h kitten zoom_neighbor.py left
map ctrl+s>l kitten zoom_neighbor.py right

# moving panes
map ctrl+s>shift+h move_window left
map ctrl+s>shift+j move_window down
map ctrl+s>shift+k move_window up
map ctrl+s>shift+l move_window right

# resizing panes
map shift+alt+h resize_window narrower 3
map shift+alt+l resize_window wider 3
map shift+alt+j resize_window shorter 3
map shift+alt+k resize_window taller 3
# reset all windows in the tab to default sizes
map shift+alt+= resize_window reset

map ctrl+s>x close_window


# ------------------------------
# appearance
# ------------------------------
tab_bar_edge top
tab_bar_min_tabs 1
tab_bar_align center
tab_bar_style separator
tab_bar_margin_height 5 0
tab_separator ""
tab_bar_margin_width 15

# tabs
active_tab_font_style   bold
inactive_tab_font_style normal

# Tab colours and rounded title templates come from the shared desktop palette.

# pane borders
window_border_width 1pt
inactive_text_alpha 0.8 
