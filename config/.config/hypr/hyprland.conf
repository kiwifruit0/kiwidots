# source keybinds file
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/vars.conf

################
### MONITORS ###
################

monitor=eDP-1,2944x1840@90,auto,auto,cm,auto
monitor=desc:Dell Inc. DELL U3824DW,preferred,auto-center-up,1.333
monitor=desc:Sony SONY TV,preferred,auto-center-up,1
monitor=,preferred,auto-center-up,auto

xwayland {
  force_zero_scaling = true
}


###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = dolphin
$menu = rofi --show drun


#################
### AUTOSTART ###
#################

exec-once = waybar & hyprsunset & hypridle & hyprpaper

exec-once = dbus-update-activation-environment --systemd HYPRLAND_INSTANCE_SIGNATURE
exec-once = hyprctl dispatch workspace 1
exec-once = rfkill unblock all


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,16
env = XCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,16
env = HYPRSHOT_DIR,$HOME/pictures/screenshots

# zsh config directory
env = ZDOTDIR,$HOME/.config/zsh

# xdg locations
env = XDG_CONFIG_HOME,$HOME/.config
env = XDG_CACHE_HOME,$HOME/.cache
env = XDG_DATA_HOME,$HOME/.local/share

# neovim as sudo editor
env = SUDO_EDITOR,/usr/bin/nvim

# scaling
env = GDK_SCALE,2
env = GTK_DPI_SCALE,1
env = QT_SCALE_FACTOR,1.5


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
  gaps_in = 3
  gaps_out = 5

  border_size = 2

  col.active_border = $active_border1 $active_border2 $border_rotation
  col.inactive_border = $inactive_border

  resize_on_border = true

  allow_tearing = false

  layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
  rounding = 8
  rounding_power = 2

  # Change transparency of focused and unfocused windows
  # active_opacity = 1.0
  # inactive_opacity = 1.0

  shadow {
    enabled = false
    range = 4
    render_power = 3
    color = rgba(1a1a1aee)
  }

  blur {
    enabled = true
    size = 7
    passes = 3
    noise = 0.01
  }
}

animations {
  enabled = yes, please :)

  # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
  #    NAME,       X0,   Y0,   X1,   Y1
  bezier = easeOutQuint,   0.23, 1,  0.32, 1
  bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
  bezier = linear,     0,  0,  1,  1
  bezier = almostLinear,   0.5,  0.5,  0.75, 1
  bezier = quick,      0.15, 0,  0.1,  1

  # Default animations, see https://wiki.hypr.land/Configuring/Animations/
  #       NAME,      ONOFF, SPEED, CURVE,    [STYLE]
  animation = global,    1,   10,  default
  animation = border,    1,   5.39,  easeOutQuint
  animation = windows,     1,   4.79,  easeOutQuint
  animation = windowsIn,   1,   4.1,   easeOutQuint, popin 87%
  animation = windowsOut,  1,   1.49,  linear,     popin 87%
  animation = fadeIn,    1,   1.73,  almostLinear
  animation = fadeOut,     1,   1.46,  almostLinear
  animation = fade,      1,   3.03,  quick
  animation = layers,    1,   3.81,  easeOutQuint
  animation = layersIn,    1,   4,   easeOutQuint, fade
  animation = layersOut,   1,   1.5,   linear,     fade
  animation = fadeLayersIn,  1,   1.79,  almostLinear
  animation = fadeLayersOut, 1,   1.39,  almostLinear
  animation = workspaces,  1,   1.94,  almostLinear, fade
  animation = workspacesIn,  1,   1.21,  almostLinear, fade
  animation = workspacesOut, 1,   1.94,  almostLinear, fade
  animation = zoomFactor,  1,   7,   quick
}


dwindle {
  pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
  preserve_split = true # You probably want this
}

master {
  new_status = master
}

misc {
  vfr = true
  force_default_wallpaper = 0
  disable_hyprland_logo = true
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
  kb_layout = gb
  kb_variant = ,qwerty
  kb_model =
  kb_options =
  kb_rules =

  follow_mouse = 1

  sensitivity = 1

  accel_profile = flat

  touchpad {
    natural_scroll = true
    scroll_factor = 0.25
  }
}

gesture = 3, horizontal, workspace


##############################
### WINDOWS AND WORKSPACES ###
##############################

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
  name = suppress-maximize-events
  match:class = .*

  suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
  name = fix-xwayland-drags
  match:class = ^$
  match:title = ^$
  match:xwayland = true
  match:float = true
  match:fullscreen = false
  match:pin = false
  no_focus = true
}

# TRANSPARENCY
# windowrule = match:class ^kitty$, match:float true, border_color rgba(FFFFF00)
# windowrule = match:class ^kitty$, match:float false, border_color $active_border1 $active_border2 $border_rotation

# windowrule = match:class ^kitty$, float 1
# windowrule = match:class ^kitty$, center 1
windowrule = match:class ^kitty$, size (monitor_w*0.8) (monitor_h*0.8)
windowrule = match:class Mochi, match:float true, size 800 600, center 1


# wiremix
windowrule = match:class ^(wiremix-tui)$, float 1
windowrule = match:class ^(wiremix-tui)$, center 1
windowrule = match:class ^(wiremix-tui)$, size 800 400

# general apps
# Spotify → special workspace
windowrule = match:class spotify, workspace special:magic
layerrule = match:class selector, no_anim on

# Java / SceneBuilder flickering fixes
windowrule = match:class ^SceneBuilder$, match:title ^SceneBuilder$, no_focus on
windowrule = match:class ^SceneBuilder$, match:title ^SceneBuilder$, no_initial_focus on
windowrule = match:class ^SceneBuilder$, match:title ^SceneBuilder$, border_size 0
windowrule = match:class ^SceneBuilder$, match:title ^SceneBuilder$, no_shadow on
windowrule = match:class ^(com\.oracle\.javafx\.scenebuilder\.app\.SceneBuilderApp)$, match:float 1, no_initial_focus on
windowrule = match:class ^(com\.oracle\.javafx\.scenebuilder\.app\.SceneBuilderApp)$, match:float 0, stay_focused 1

