$font = JetbrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}


animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 15
    contrast = 0.5
    brightness = 0.6
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 6
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(8fbcbbee) rgba(81a1c1ee) 135deg
    check_color = rgba(b48eadff) rgba(81a1c1ff) 135deg
    fail_color = rgba(bf616aff) rgba(d08770ff) 45deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = password
    fail_text = $PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    position = 0, -4%
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME 
    font_size = 100
    font_family = $font

    position = -30, 0
    halign = center
    valign = center
    position = 0, 4%
}
