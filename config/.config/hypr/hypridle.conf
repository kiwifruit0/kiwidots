general {
    lock_cmd = pidof hyprlock || hyprlock
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    inhibit_sleep = 2
}

# dim screen after 3 minutes
listener {
    timeout = 180
    on-timeout = $HOME/.config/hypr/scripts/hypridle_audio.sh "dim"
    on-resume = brightnessctl -r
}

# lock screen after 5 minutes
listener {
    timeout = 300
    on-timeout = $HOME/.config/hypr/scripts/hypridle_audio.sh "sleep"
}
