set -g status-right "#[fg={{fg}}]#S  "
set -g status-style bg=default,fg={{fg}}
set -g window-status-current-style "#{?window_zoomed_flag,bg={{secondary}},bg={{accent}}},fg={{bg}}"
set -g pane-border-style fg={{raised}}
set -g pane-active-border-style fg={{accent}}
set -g message-style bg={{surface}},fg={{fg}}
set -g mode-style bg={{accent}},fg={{bg}}
