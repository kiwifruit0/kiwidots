# ------------------------------
# general options
# ------------------------------

# change leader to control + s
set -g prefix C-s

# reload on leader + r
unbind r
bind r source-file $HOME/.config/tmux/tmux.conf

# window navigation
set -g mouse on
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# options
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g allow-passthrough on

# QoL
set -g escape-time 0
set -g repeat-time 1000
set -g history-limit 10000
set -g display-time 4000


# ------------------------------
# keybinds
# ------------------------------

bind o split-window -v
bind v split-window -h
bind f resize-pane -Z


# ------------------------------
# appearance
# ------------------------------

# colors
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

# status bar
set-option -g status-position top

set -g status-left ""
set -g status-right "#[fg=#d8dee9]#S  "
set -g status-justify "absolute-centre"

set -g window-status-format " #W "
set -g window-status-current-format " #W "

set -g window-status-bell-style "bg=red,nobold"
set -g status-style bg=default,fg=#d8dee9
# set -g window-status-current-style bg=#81a1c1,fg=#2e3440
set -g window-status-current-style "#{?window_zoomed_flag,bg=#8fbcbb,bg=#81a1c1},fg=#2e3440"

# pane separators
set -g pane-border-lines simple
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=#81a1c1


# ------------------------------
# plugins
# ------------------------------

# list of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# source plugin manager
run '$HOME/.config/tmux/plugins/tpm/tpm'
